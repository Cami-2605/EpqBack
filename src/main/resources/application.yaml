server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/epq_db?useSSL=false&serverTimezone=America/Bogota&useGssapi=false
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: EPQSecretKey2024SecureAndLongEnoughForHS512Algorithm
  expiration: 86400000

# Orígenes CORS permitidos (separados por coma)
# Agregar el dominio de producción cuando se despliegue
cors:
  allowed-origins: http://localhost:4200,http://localhost:3000

logging:
  level:
    com.epq.epqbackend: DEBUG